<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Result</title>
</head>
<body>
    <h1>Your item:</h1>
    <img src="{{ img_sub }}" width="140">

    <h1>Related items:</h1>
    {% if rel[0] %}
        Click on any item to browse its related items.
        {% for each in rel %}
            {% if each %}
                <form action="/result" method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="image" src="{{ each }}" width="140" height="140" value="{{ each }}">
                    <button type="submit">
                        <img src="{{ each }}" width="140" height="140">
                    </button>
                </form>
            {% endif %}
        {% endfor %}
    {% else %}
        No related items found.
    {% endif %}

    <p>
    <li><a href="http://127.0.0.1:5000/">Return to index page</a></li>
    </p>

</body>
</html>
